name: Public beta release
on:
  push:
    tags: ['v*-beta.*']
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:smoke
      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged executable
        run: node tests/smoke.mjs
        env:
          WORKBENCH_TEST_EXECUTABLE: release/win-unpacked/Optic.exe
      - name: Prepare verified assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item release/Optic-*-win-x64.exe release-assets/
          Copy-Item resources/THIRD_PARTY_NOTICES.txt release-assets/
          Copy-Item LICENSE release-assets/
          $lines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: optic-windows-beta
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failure-screenshots
          path: artifacts/**/*.png
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged Linux smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/smoke.mjs
        env:
          WORKBENCH_TEST_EXECUTABLE: release/linux-unpacked/optic
      - name: Packaged macOS smoke
        if: runner.os == 'macOS'
        run: node tests/smoke.mjs
        env:
          WORKBENCH_TEST_EXECUTABLE: release/mac-arm64/Optic.app/Contents/MacOS/Optic
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, platform-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optic-windows-beta
          path: release-assets
      - name: Publish beta after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Optic $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
