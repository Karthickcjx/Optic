name: Validate desktop application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-screenshots
          path: artifacts/**/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-build
          path: release/*
